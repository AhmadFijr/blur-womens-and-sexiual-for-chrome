<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Module Test</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #container { position: relative; }
    #canvas { position: absolute; top: 0; left: 0; }
    #log { margin-top: 1rem; font-family: monospace; }
  </style>
</head>
<body>
  <h1>AI Module Test</h1>
  <p>Select an image file to test the NudeNet model.</p>
  <input type="file" id="upload" accept="image/*">
  <div id="container">
    <img id="image" style="display: none;" />
    <canvas id="canvas"></canvas>
  </div>
  <pre id="log"></pre>
  
  <!-- 
    We need to load TensorFlow.js and the script to run the model.
    For this test, we will use the versions from the nudenet-tfjs project.
    In the final extension, these will be bundled.
  -->
  <script src="../../nudenet-tfjs/node_modules/@tensorflow/tfjs/dist/tf.min.js"></script>
  <script src="ai_test.js"></script>
</body>
</html>
